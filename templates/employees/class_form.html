<!DOCTYPE html>
<html>
<head>

    <title>{{ title }}</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button,
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .errorlist {
            color: #dc3545;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>{{ title }}</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Class
        </button>

        <a
            href="{% url 'class_list' %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

</body>
</html>
