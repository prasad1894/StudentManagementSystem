<!DOCTYPE html>
<html>
<head>

    <title>Delete Class</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
        }

        button,
        a {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #dc3545;
            color: white;
        }

        a {
            background: #6c757d;
            color: white;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Delete Class?</h2>

    <p>
        Are you sure you want to delete:
    </p>

    <strong>
        {{ class_section }}
    </strong>

    <p>
        This action cannot be undone.
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

        <a href="{% url 'class_list' %}">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
