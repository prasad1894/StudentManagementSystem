<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Classes</title>

```
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f6f9;
        padding: 25px;
    }

    .container {
        max-width: 700px;
        margin: auto;
    }

    nav {
        background: #212529;
        padding: 15px 20px;
        border-radius: 8px;
        margin-bottom: 25px;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin-right: 20px;
        font-weight: bold;
    }

    .box {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
        margin-bottom: 10px;
    }

    .subtitle {
        color: #666;
        margin-bottom: 25px;
    }

    .class-item {
        display: flex;
        align-items: center;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        margin-bottom: 10px;
    }

    .class-item input {
        margin-right: 12px;
        width: 18px;
        height: 18px;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 5px;
        background: #0d6efd;
        color: white;
        font-size: 16px;
        cursor: pointer;
        margin-top: 15px;
    }

    button:hover {
        background: #0b5ed7;
    }

    .empty {
        background: #fff3cd;
        padding: 15px;
        border-radius: 6px;
        color: #856404;
    }
</style>
```

</head>

<body>

<div class="container">

```
<nav>
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'faculty_list' %}">Faculty</a>
    <a href="{% url 'student_list' %}">Students</a>
    <a href="{% url 'logout' %}">Logout</a>
</nav>

<div class="box">

    <h1>Assign Classes</h1>

    <p class="subtitle">
        Faculty: <strong>{{ faculty.user.username }}</strong>
    </p>

    <form method="post">
        {% csrf_token %}

        {% if classes %}

            {% for class in classes %}
                <label class="class-item">

                    <input
                        type="checkbox"
                        name="classes"
                        value="{{ class.id }}"
                        {% if class in assigned_classes %}checked{% endif %}
                    >

                    <span>{{ class }}</span>

                </label>
            {% endfor %}

            <button type="submit">
                Save Class Assignments
            </button>

        {% else %}

            <div class="empty">
                No classes have been created yet.
            </div>

        {% endif %}

    </form>

</div>
```

</div>

</body>
</html>
